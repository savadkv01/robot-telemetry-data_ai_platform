global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kafka_exporter
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: postgres_exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: robot_metrics_api
    static_configs:
      - targets:
          - host.docker.internal:8000
